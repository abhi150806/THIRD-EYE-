<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THIRD-EYE Deepfake Detection</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
--bg:#0b0b0b;
--card:#161616;
--accent:#d4af37;
--text:#ffffff;
--text2:#bfbfbf;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif
}

body{
background:linear-gradient(160deg,#000,#111);
color:var(--text);
overflow-x:hidden;
}

/* NAVBAR */
nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:18px 80px;
border-bottom:1px solid #222;
}

.logo{
font-size:20px;
font-weight:600;
letter-spacing:2px;
color:var(--accent);
}

nav ul{
display:flex;
gap:30px;
list-style:none;
}

nav a{
text-decoration:none;
color:var(--text2);
font-size:14px;
letter-spacing:1px;
transition:.2s;
}

nav a:hover{
color:var(--accent);
}

/* HERO */
.hero{
height:60vh;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center;
padding:20px;
}

.hero h1{
font-size:72px;
letter-spacing:10px;
font-weight:600;
}

.hero p{
margin-top:15px;
color:var(--text2);
letter-spacing:2px;
}

/* MAIN */
.section{
padding:70px 20px;
text-align:center;
}

.title{
font-size:36px;
color:var(--accent);
margin-bottom:15px;
}

.description{
max-width:700px;
margin:auto;
color:var(--text2);
margin-bottom:50px;
line-height:1.6;
}

/* CARD - FIXED LAYOUT */
.card{
background:var(--card);
border-radius:16px;
padding:60px 45px;
max-width:600px;
margin:auto;
border:1px solid #222;
display:flex;
flex-direction:column;
align-items:center;
gap:25px;
}

/* UPLOAD BOX - PERFECT POSITIONING */
.upload-box{
border:3px dashed var(--accent);
padding:60px 40px;
border-radius:16px;
cursor:pointer;
margin:0;
transition:0.3s;
width:100%;
max-width:400px;
text-align:center;
}

.upload-box:hover{
background:rgba(212,175,55,0.05);
border-color:#ffd700;
transform:scale(1.02);
}

.upload-box p{
color:var(--text2);
}

/* FILE INPUT */
input[type=file]{
display:none;
}

/* BUTTON - ENHANCED */
.btn{
background:linear-gradient(45deg,var(--accent),#ffd700);
border:none;
padding:16px 40px;
font-size:15px;
font-weight:500;
letter-spacing:2px;
cursor:pointer;
border-radius:8px;
box-shadow:0 4px 15px rgba(212,175,55,0.3);
transition:0.3s;
white-space:nowrap;
margin-top:10px;
}

.btn:hover{
opacity:.9;
transform:translateY(-2px);
box-shadow:0 6px 20px rgba(212,175,55,0.4);
}

/* IMAGE PREVIEW */
#preview{
margin:0;
max-width:100%;
max-height:300px;
border-radius:12px;
border:1px solid #333;
display:none;
box-shadow:0 8px 25px rgba(0,0,0,0.5);
}

/* LOADER */
.loader{
margin:35px auto;
border:4px solid #333;
border-top:4px solid var(--accent);
border-radius:50%;
width:45px;
height:45px;
animation:spin 1s linear infinite;
display:none;
}

@keyframes spin{
100%{transform:rotate(360deg)}
}

/* RESULT */
.result-card{
margin-top:35px;
padding:25px;
border-radius:10px;
background:#111;
border:1px solid #222;
display:none;
width:100%;
max-width:400px;
}

.result-title{
font-size:22px;
margin-bottom:8px;
}

.confidence{
font-size:28px;
color:var(--accent);
margin-top:6px;
}

.fake{color:#ff5e5e}
.real{color:#00e0a1}

/* FOOTER */
footer{
margin-top:100px;
padding:25px;
text-align:center;
color:#777;
font-size:13px;
border-top:1px solid #222;
}

/* RESPONSIVE */
@media(max-width:768px){
nav{
padding:18px 30px;
}
.hero h1{
font-size:48px;
letter-spacing:5px;
}
.card{
padding:40px 25px;
margin:0 20px;
}
.upload-box{
padding:40px 20px;
}
}
</style>
</head>

<body>

<nav>
<div class="logo">THIRD-EYE</div>
<ul>
<li><a href="#">HOME</a></li>
<li><a href="#">ABOUT</a></li>
</ul>
</nav>

<section class="hero">
<h1>THIRD-EYE</h1>
<p>UNVEIL THE TRUTH BEHIND MEDIA</p>
</section>

<section class="section">
<h2 class="title">Image Deepfake Detection</h2>

<p class="description">
THIRD-EYE analyzes pixel artifacts, lighting inconsistencies and frequency patterns to detect AI-generated deepfake images using advanced neural networks.
</p>

<div class="card">
<label class="upload-box">
<p>UPLOAD IMAGE (Max 10MB)</p>
<input type="file" id="imageInput" accept="image/*" onchange="previewImage(event)">
</label>

<img id="preview">

<button class="btn" onclick="submitImage()">ACTIVATE THIRD-EYE</button>

<div class="loader" id="loader"></div>

<div class="result-card" id="resultCard">
<div class="result-title" id="predictionText"></div>
<div class="confidence" id="confidenceText"></div>
</div>
</div>

</section>

<footer>
© 2026 THIRD-EYE Team | KIIT University
</footer>

<script>
let processing=false

function previewImage(event){
const file=event.target.files[0]
const preview=document.getElementById("preview")

if(file){
preview.src=URL.createObjectURL(file)
preview.style.display="block"
}
}

function submitImage(){
if(processing) return

const file=document.getElementById("imageInput").files[0]

if(!file){
alert("Upload an image first")
return
}

processing=true

document.getElementById("loader").style.display="block"
document.getElementById("resultCard").style.display="none"

const formData=new FormData()
formData.append("image",file)

fetch("/predict",{
method:"POST",
body:formData
})
.then(res=>res.json())
.then(data=>{
document.getElementById("loader").style.display="none"

const pred=data.prediction.toLowerCase()
const conf=(data.confidence*100).toFixed(2)

const resultCard=document.getElementById("resultCard")
const predText=document.getElementById("predictionText")
const confText=document.getElementById("confidenceText")

predText.innerText=pred==="real" ? "REAL IMAGE" : "FAKE IMAGE"
predText.className=pred==="real"?"real":"fake"

confText.innerText=conf+"% Confidence"

resultCard.style.display="block"
})
.catch(err=>{
console.log(err)
alert("Error processing image")
})
.finally(()=>{
processing=false
})
}
</script>

</body>
</html>
